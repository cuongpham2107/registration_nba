services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: registration_nba_app
        container_name: registration_nba_app
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: app
            SERVICE_TAGS: dev
            REVERB_SERVER_HOST: "0.0.0.0"
        env_file:
            - .env
        volumes:
            # Mount source để dev/quick edits, nhưng giữ lại build output từ image
            - ./:/var/www/html
            - vendor-data:/var/www/html/vendor
            # Dùng named volume chung để webserver cũng đọc được build assets
            - public-build:/var/www/html/public/build
            - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
            - ./.env:/var/www/html/.env
        ports:
            - "8080:8080"
        networks:
            - app-network

    db:
        image: mysql:8.0
        container_name: registration_nba_db
        restart: unless-stopped
        tty: true
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: registration_nba
            MYSQL_ROOT_PASSWORD: Asg@2025??
            MYSQL_PASSWORD: Asg@2025??
            MYSQL_USER: nba_user
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        image: registration_nba_scheduler
        container_name: registration_nba_scheduler
        restart: unless-stopped
        tty: true
        env_file:
            - .env
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - vendor-data:/var/www/html/vendor
            - public-build:/var/www/html/public/build
            - ./.env:/var/www/html/.env
        depends_on:
            - app
        command: php artisan schedule:work
        networks:
            - app-network
    webserver:
        image: nginx:alpine
        container_name: registration_nba_webserver
        restart: unless-stopped
        tty: true
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www/html
            # Giữ lại /public/build (Vite manifest + assets) được build trong image
            - public-build:/var/www/html/public/build
            # Mount certs cho HTTPS; admin chỉ cần đặt fullchain.pem và privkey.pem vào đây
            - ./.docker/nginx/ssl:/etc/nginx/ssl:ro
            - ./.docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    dbdata:
        driver: local

    vendor-data:
        driver: local

    public-build:
        driver: local

