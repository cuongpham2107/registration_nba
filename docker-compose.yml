services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: registration_nba_app
        container_name: registration_nba_app
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: app
            SERVICE_TAGS: dev
            REVERB_SERVER_HOST: "0.0.0.0"
        env_file:
            - .env
        volumes:
            - app-code:/var/www/html
            - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
            - ./.env:/var/www/html/.env
        ports:
            - "8080:8080"
        networks:
            - app-network
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: registration_nba_db
        restart: unless-stopped
        tty: true
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: registration_nba
            MYSQL_ROOT_PASSWORD: Asg@2025??
            MYSQL_PASSWORD: Asg@2025??
            MYSQL_USER: nba_user
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network
    scheduler:
        build: .
        container_name: laravel_scheduler
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            - app
        command: php artisan schedule:work
    webserver:
        image: nginx:alpine
        container_name: registration_nba_webserver
        restart: unless-stopped
        tty: true
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - app-code:/var/www/html
            - ./.docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
    app-code:
